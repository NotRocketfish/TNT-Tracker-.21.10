plugins {
	id 'fabric-loom' version '1.6.5'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://api.modrinth.com/maven" }   // ← Hier hin
}

dependencies {
	minecraft "com.mojang:minecraft:1.20.4"
	mappings "net.fabricmc:yarn:1.20.4+build.3:v2"
	modImplementation "net.fabricmc:fabric-loader:0.15.7"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.91.2+1.20.4"
	modRuntimeOnly "maven.modrinth:sodium:mc1.20.4-0.5.8"

	modApi "me.shedaniel.cloth:cloth-config-fabric:13.0.138"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	// Das hier brauchst du nur, wenn du auf Modrinth publishen willst
	// repositories {
	//     maven { url "https://api.modrinth.com/maven" }
	// }
}
